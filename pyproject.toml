[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "datasetvet"
version = "0.0.0"
description = "Before you train on it, check it: a report card of verifiable facts about a dataset."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mohamed Elsaka" }]
keywords = ["dataset", "license", "provenance", "data-quality", "huggingface"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "huggingface_hub>=1.2",
  "httpx2>=2.16",
  "pyarrow>=21",
  "duckdb>=1.1",
  "xxhash>=3.4",
  "pyyaml>=6",
  "phonenumbers>=8.13",
  "rich>=13",
  "license-expression>=30.3",
  "tzdata; sys_platform == 'win32'",  # pyarrow needs it to decode tz-aware timestamps on Windows
]

[project.optional-dependencies]
# ScanCode licence detection (PLAN.md section 4). Measured on Windows: needs pluggy<1.6,
# typecode-libmagic, a short venv path and PowerShell rather than Git Bash (PLAN.md 9).
scan = [
  "scancode-toolkit-mini>=32.5",
  "pluggy<1.6",
  "typecode-libmagic; sys_platform == 'win32'",
]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
datasetvet = "datasetvet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datasetvet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet; skipped unless -m network"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
